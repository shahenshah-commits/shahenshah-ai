<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahenshah AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<header class="topbar">
<div class="brand">
<div class="logo">S</div>
<div>
<h1>Shahenshah AI</h1>
<span>Personal AI Assistant</span>
</div>
</div>
<button id="clearBtn">Clear Chat</button>
</header>

<main id="chat"></main>

<section class="welcome" id="welcome">
<div class="welcome-logo">S</div>
<h2>Welcome to Shahenshah AI</h2>
<p>Ask me anything and let's build something amazing.</p>
</section>

<form id="chatForm" class="composer">
<textarea id="messageInput" placeholder="Message Shahenshah AI..." rows="1"></textarea>
<button type="submit" id="sendBtn">➤</button>
</form>

</div>

<script src="app.js"></script>
</body>
</html>
